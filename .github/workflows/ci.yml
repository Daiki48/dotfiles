name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  required-ci:
    name: required-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1; SHA from the verified official release.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run Python hook tests
        run: python3 -m unittest discover -s .codex/hooks -p 'test_*.py'

      - name: Run Python helper tests
        run: python3 -m unittest discover -s .codex/helpers -p 'test_*.py'

      - name: Run GitHub Ruleset tests
        run: python3 -m unittest discover -s .github/rulesets -p 'test_*.py'

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
