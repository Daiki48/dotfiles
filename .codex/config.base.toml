# Codexの新端末用base config。
#
# install CLIはこのtemplateを~/.codex/config.tomlへcopyし、既存端末では
# 下記の共有keyだけを安全に移行する。端末依存の設定はlocal fileに保持する。
#   - [projects.*]  project trust
#   - [hooks.state] hookのtrusted hash
#   - [tui.*]      TUI state
#
# repository内ではconfig.base.tomlという名前にし、project configとして
# Codexに自動読込されないようにする。

model = "gpt-6-astra"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "codex-autonomous"

# Codex/OpenAIのco-authorや生成表記をcommit messageへ追加しない。
# Codex CLI 0.150.1でstrict config検証済み。
commit_attribution = ""

[features]
hooks = true
goals = true
# rollout_budgetは共有token上限到達時にturnを停止するため使わない。
# 失敗loopはAGENTSのsemantic circuit breakerと診断budgetで制御する。

[features.rollout_budget]
enabled = false

[permissions.codex-autonomous]
description = "Autonomous workspace access with operational Git policy checks."
extends = ":workspace"

# install CLIが端末上の絶対pathを追加する。
[permissions.codex-autonomous.workspace_roots]

[permissions.codex-autonomous.filesystem.":workspace_roots"]
".git" = "write"

[permissions.codex-autonomous.network]
enabled = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "xhigh"

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = '"$HOME/.codex/hooks/block-git-write"'
timeout = 10
statusMessage = "Git/GitHub操作を確認中"
