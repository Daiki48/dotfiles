# Codexの新端末用base config。
#
# install CLIはこのtemplateを~/.codex/config.tomlへcopyし、既存端末では
# 下記の共有keyだけを安全に移行する。端末依存の設定はlocal fileに保持する。
#   - [projects.*]  project trust
#   - [hooks.state] hookのtrusted hash
#   - [tui.*]      TUI state
#
# repository内ではconfig.base.tomlという名前にし、project configとして
# Codexに自動読込されないようにする。

model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

# Codex/OpenAIのco-authorや生成表記をcommit messageへ追加しない。
# Codex CLI 0.147.0でstrict config検証済み。hookでもAI帰属を拒否する。
commit_attribution = ""

[sandbox_workspace_write]
network_access = true

# 通常のsubagentは探索・実装・レビューを十分に扱えるTerraへ寄せる。
# 狭い実装はSkillからLuna xhigh、高難度の判断だけSol highを明示する。
[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

# workspace-write sandboxを主境界とし、hookはGit/GitHubの引数、削除操作、
# secret、AI帰属を早期検査する多層防御として使う。
# 新端末またはhook更新後は、対話Codexの/hooksで内容を確認して信頼登録する。
[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/block_git_write.py"'
timeout = 10
statusMessage = "開発ワークフローの安全性を確認中"
